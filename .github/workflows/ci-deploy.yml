name: CI and publish deploy bundle

# On every push to main: run backend tests and the frontend type-check, tests and build.
# Only if all of them pass, publish a ready-to-run bundle to the `deploy` branch.
# The VM pulls that branch (see deploy/vm/README.md). No secrets are used: the built-in
# GITHUB_TOKEN is enough, and nothing in this workflow ever connects to the VM.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # constraints.txt pins every package to the versions the suite was last verified with, so a new upstream
      # release cannot turn CI red by itself. Refresh it deliberately (see the note at the top of the file).
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt pytest-cov
      - run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=85
        working-directory: backend
      - name: Known vulnerabilities in dependencies (advisory, does not fail the build)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r backend/requirements.txt -c backend/constraints.txt || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build   # runs tsc, then vite build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning -x deploy/vm/*.sh
      - run: bash deploy/vm/test_deploy.sh

  publish:
    needs: [backend, frontend, shell]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: bundle/frontend/dist
      - name: Assemble bundle
        run: |
          mkdir -p bundle/backend bundle/deploy
          cp -r backend/app bundle/backend/app
          cp backend/requirements.txt bundle/backend/requirements.txt
          cp -r deploy/vm bundle/deploy/vm
          find bundle -name __pycache__ -type d -prune -exec rm -rf {} +
          printf 'sha=%s\nbuilt=%s\n' "$GITHUB_SHA" "$(date +%s)" > bundle/DEPLOY_VERSION
      - name: Push bundle to the deploy branch
        run: |
          cd bundle
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy bundle for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
